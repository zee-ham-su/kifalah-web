kind = "web"
previewPath = "/"
title = "Kifalah Foundation Ghana"
version = "1.0.0"
id = "artifacts/kifalah-foundation"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25297

[services.development]
run = "pnpm --filter @workspace/kifalah-foundation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kifalah-foundation", "run", "build" ]
serve = "static"
publicDir = "artifacts/kifalah-foundation/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25297"
BASE_PATH = "/"
